<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow -->
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64c8ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a2be2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Robot head outer frame -->
  <rect x="16" y="12" width="32" height="36" rx="4" fill="none" stroke="url(#robotGradient)" stroke-width="2" filter="url(#glow)"/>

  <!-- Eyes -->
  <circle cx="26" cy="24" r="4" fill="#64c8ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="38" cy="24" r="4" fill="#64c8ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="12" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="2" fill="#d4af37">
    <animate attributeName="fill" values="#d4af37;#64c8ff;#d4af37" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Mouth/interface line -->
  <path d="M 24 34 Q 32 38 40 34" stroke="#8a2be2" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Circuit pattern inside head -->
  <line x1="20" y1="28" x2="24" y2="28" stroke="#64c8ff" stroke-width="1" opacity="0.6"/>
  <line x1="40" y1="28" x2="44" y2="28" stroke="#64c8ff" stroke-width="1" opacity="0.6"/>
  <circle cx="19" cy="28" r="1" fill="#64c8ff" opacity="0.8"/>
  <circle cx="45" cy="28" r="1" fill="#64c8ff" opacity="0.8"/>

  <!-- Neural network pattern -->
  <line x1="26" y1="40" x2="32" y2="42" stroke="#8a2be2" stroke-width="1" opacity="0.5"/>
  <line x1="38" y1="40" x2="32" y2="42" stroke="#8a2be2" stroke-width="1" opacity="0.5"/>
  <circle cx="26" cy="40" r="1.5" fill="#8a2be2" opacity="0.7"/>
  <circle cx="38" cy="40" r="1.5" fill="#8a2be2" opacity="0.7"/>
  <circle cx="32" cy="42" r="1.5" fill="#d4af37" opacity="0.8">
    <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Neck connector -->
  <rect x="28" y="48" width="8" height="4" rx="1" fill="url(#robotGradient)" opacity="0.7"/>

  <!-- Body hint -->
  <path d="M 24 52 L 24 58 L 28 60 L 36 60 L 40 58 L 40 52" stroke="url(#robotGradient)" stroke-width="2" fill="none" stroke-linejoin="round"/>

  <!-- Shoulder joints -->
  <circle cx="24" cy="54" r="2" fill="#64c8ff" opacity="0.6"/>
  <circle cx="40" cy="54" r="2" fill="#64c8ff" opacity="0.6"/>
</svg>
